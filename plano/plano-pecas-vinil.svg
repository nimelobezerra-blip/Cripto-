<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="1260" viewBox="0 0 1000 1260" font-family="Arial, Helvetica, sans-serif">
  <rect width="1000" height="1260" fill="#ffffff"/>
  <text x="40" y="45" font-size="26" font-weight="bold" fill="#1a2a4a">Plano de corte – peças de vinil (medidas em cm, escala 1:50)</text>
  <g fill="#dbe7f7" stroke="#1a3a7a" stroke-width="2">
    <rect x="60" y="90" width="600" height="70"/>
    <rect x="60" y="210" width="600" height="70"/>
    <rect x="60" y="330" width="260" height="70"/>
    <rect x="400" y="330" width="260" height="70"/>
    <rect x="60" y="450" width="300" height="160"/>
    <rect x="60" y="660" width="420" height="70"/>
    <rect x="60" y="780" width="480" height="70"/>
  </g>
  <g font-size="18" font-weight="bold" fill="#1a3a7a" text-anchor="middle">
    <text x="360" y="132">A</text><text x="360" y="252">B</text>
    <text x="190" y="372">C</text><text x="530" y="372">D</text>
    <text x="210" y="537">E</text><text x="270" y="702">F</text><text x="300" y="822">G</text>
  </g>
  <g font-size="15" fill="#333" text-anchor="middle">
    <text x="360" y="180">300</text><text x="360" y="300">300</text>
    <text x="190" y="420">130</text><text x="530" y="420">130</text>
    <text x="210" y="630">150</text><text x="270" y="750">210</text><text x="300" y="870">240</text>
  </g>
  <g font-size="15" fill="#333">
    <text x="670" y="130">35</text><text x="670" y="250">35</text>
    <text x="330" y="370">35</text><text x="670" y="370">35</text>
    <text x="370" y="535">80</text><text x="490" y="700">35</text><text x="550" y="820">35</text>
  </g>
  <g font-size="16" fill="#0a6b3a" font-weight="bold">
    <text x="720" y="130">1,050 m²</text>
    <text x="720" y="250">1,050 m²</text>
    <text x="720" y="370">0,455 m² cada</text>
    <text x="400" y="535">1,200 m²</text>
    <text x="530" y="700">0,735 m²</text>
    <text x="600" y="820">0,840 m²</text>
  </g>

  <g font-size="16" fill="#222">
    <rect x="60" y="910" width="880" height="320" fill="#f6f8fb" stroke="#c5cfdd"/>
    <text x="80" y="945" font-weight="bold" font-size="18">Resumo das áreas</text>
    <text x="80" y="980" font-weight="bold">Peça</text><text x="200" y="980" font-weight="bold">Medida (cm)</text>
    <text x="400" y="980" font-weight="bold">Qtd</text><text x="480" y="980" font-weight="bold">Área unit.</text><text x="660" y="980" font-weight="bold">Área total</text>
    <text x="80" y="1010">A + B</text><text x="200" y="1010">300 × 35</text><text x="400" y="1010">2</text><text x="480" y="1010">1,050 m²</text><text x="660" y="1010">2,100 m²</text>
    <text x="80" y="1040">C + D</text><text x="200" y="1040">130 × 35</text><text x="400" y="1040">2</text><text x="480" y="1040">0,455 m²</text><text x="660" y="1040">0,910 m²</text>
    <text x="80" y="1070">E</text><text x="200" y="1070">150 × 80</text><text x="400" y="1070">1</text><text x="480" y="1070">1,200 m²</text><text x="660" y="1070">1,200 m²</text>
    <text x="80" y="1100">F</text><text x="200" y="1100">210 × 35</text><text x="400" y="1100">1</text><text x="480" y="1100">0,735 m²</text><text x="660" y="1100">0,735 m²</text>
    <text x="80" y="1130">G</text><text x="200" y="1130">240 × 35</text><text x="400" y="1130">1</text><text x="480" y="1130">0,840 m²</text><text x="660" y="1130">0,840 m²</text>
    <line x1="80" y1="1150" x2="920" y2="1150" stroke="#999"/>
    <text x="80" y="1185" font-weight="bold" font-size="20">TOTAL (7 peças)</text>
    <text x="660" y="1185" font-weight="bold" font-size="20" fill="#0a6b3a">5,785 m²</text>
